name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3 or 1.2.3-rc.1); empty uses 1.0.0-dev.<run>'
        required: false
        type: string
  workflow_call:
    inputs:
      publish-artifact:
        description: 'Existing Windows Native AOT artifact from this workflow run'
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      INSTALLER_VERSION: ${{ inputs.version }}
      PUBLISH_ARTIFACT: ${{ inputs.publish-artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .artifacts/giac-runtime/win-x64
            .artifacts/installers/NovaPen-Giac-corresponding-sources-*.tar.gz
            .artifacts/installers/NovaPen-Giac-corresponding-sources-*.tar.gz.sha256
          key: giac-win-x64-${{ hashFiles('tools/prepare-giac-runtime.ps1', 'tools/giac-native/Makefile', 'tools/giac-native/build.sh', 'tools/giac-native/icas.cpp', 'tools/giac-native/test-transport.ps1') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/download-artifact@v4
        if: inputs.publish-artifact != ''
        with:
          name: ${{ inputs.publish-artifact }}
          path: .artifacts/installer-publish/win-x64
      - name: Build installer with Inno Setup 7.1.0 x64
        shell: pwsh
        run: |
          $reusePublish = -not [string]::IsNullOrEmpty($env:PUBLISH_ARTIFACT)
          .\tools\build-installer.ps1 -Version $env:INSTALLER_VERSION -SkipPublish:$reusePublish
      - name: Verify bundled Giac calculus, algebra, cancellation and input guards
        shell: pwsh
        run: dotnet run --project tools/InkMath.Solver.Probe -c Release -- .artifacts/giac-runtime/win-x64/icas.exe
      - name: Verify installation, upgrade, startup and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .artifacts/installers/*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $installer = $installers[0]
          .\tools\test-installer.ps1 -InstallerPath $installer.FullName -PublishDirectory .artifacts/installer-publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPen-Windows-Installer
          path: .artifacts/installers/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NovaPen-Installer-Test-Logs
          path: |
            .artifacts/installer-test/**/*.log
            ${{ runner.temp }}/NovaPen-Giac-source-build/build-*/**/*.log
            .artifacts/giac-runtime/win-x64/manifest.json
