  symbolic-math:
    name: Native local CAS / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install Linux CAS CLI and Native AOT build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xcas clang zlib1g-dev
      - name: Cache pinned official Windows CAS archive
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .artifacts/giac-test/xcaswininst.exe
          key: windows-cas-archive-2811493b3caf207614ebcb6d0fab46fa76c3c7938c064076d1ebb96cc389514f
      - name: Extract verified official Windows CLI without running its installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = ./tools/fetch-giac-test-runtime.ps1
          "BLURMASK_TEST_GIAC=$exe" >> $env:GITHUB_ENV
      - name: Locate Linux CLI
        if: runner.os == 'Linux'
        run: echo "BLURMASK_TEST_GIAC=$(command -v icas)" >> "$GITHUB_ENV"
      - name: Actual calculus, equations, matrices and process cancellation under Native AOT
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          dotnet publish tools/InkMath.Solver.Probe -c Release -r $rid -p:PublishAot=true -o .artifacts/solver-probe
          if ($LASTEXITCODE -ne 0) { throw 'CAS probe publish failed.' }
          $exe = if ($IsWindows) { '.artifacts/solver-probe/InkMath.Solver.Probe.exe' } else { '.artifacts/solver-probe/InkMath.Solver.Probe' }
          & $exe $env:BLURMASK_TEST_GIAC
          if ($LASTEXITCODE -ne 0) { throw 'Actual native CAS numerical/resource checks failed.' }
          dotnet build src/BlurMask -c Release -p:PublishAot=false -p:SelfContained=false
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --ai-pen-test
          if ($LASTEXITCODE -ne 0) { throw 'CAS application typesetting/equals policy integration failed.' }

  native-aot-windows:
    name: Native AOT / Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .artifacts/giac-runtime/win-x64
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz.sha256
          key: giac-win-x64-${{ hashFiles('tools/prepare-giac-runtime.ps1', 'tools/giac-native/Makefile', 'tools/giac-native/build.sh', 'tools/giac-native/icas.cpp', 'tools/giac-native/test-transport.ps1') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - name: Publish
        shell: pwsh
        run: .\tools\build.ps1 win-x64 -Version "1.0.0-dev.$env:GITHUB_RUN_NUMBER"
      - name: Native bundled Giac discovery and advanced mathematics
        shell: pwsh
        run: |
          $env:BLURMASK_TEST_GIAC = (Resolve-Path 'src/BlurMask/bin/Release/net11.0/win-x64/publish/runtimes/win-x64/solver/icas.exe').Path
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --math-solver-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Bundled solver discovery failed.' }
          dotnet run --project tools/InkMath.Solver.Probe -c Release -- $env:BLURMASK_TEST_GIAC
          if ($LASTEXITCODE -ne 0) { throw 'Bundled solver mathematical controls failed.' }
      - name: Verify static graphics and bundled formula runtime
        shell: pwsh
        run: |
          $dir = "src\BlurMask\bin\Release\net11.0\win-x64\publish"
          if (-not (Test-Path (Join-Path $dir 'BlurMask.exe'))) { throw 'Native executable is missing.' }
          if (Get-ChildItem $dir -Filter '*.dll') { throw 'Static native build contains external DLLs.' }
          if (Get-ChildItem $dir -Filter '*.pdb') { throw 'Native payload contains debug symbols.' }
          $math = Join-Path $dir 'runtimes/win-x64/native'
          foreach ($name in @('onnxruntime.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'LICENSE')) {
            if (-not (Test-Path (Join-Path $math $name))) { throw "Formula dependency is missing: $name" }
          }
      - name: Native hot-path performance probe
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --performance-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Native performance probe failed.' }
      - name: Native mask region equivalence and performance
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --mask-performance-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Mask region probe failed.' }
      - name: Native offline AI pen probe
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --ai-pen-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'AI pen probe failed.' }
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --overlay-platform-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Overlay IPC probe failed.' }
      - name: Startup and single-instance smoke test
        shell: pwsh
        env:
          BLURMASK_SMOKE_ARTIFACTS: ${{ github.workspace }}/.artifacts/ui-preview
        run: |
          $exe = Resolve-Path "src\BlurMask\bin\Release\net11.0\win-x64\publish\BlurMask.exe"

          # First process owns the single-instance mutex and remains alive long enough
          # for a duplicate launch to be tested.
          $first = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--minimized' -WindowStyle Hidden -PassThru
          Start-Sleep -Milliseconds 500

          if ($first.HasExited) {
            throw "First BlurMask instance exited before duplicate-launch test (code $($first.ExitCode))"
          }

          # A duplicate launch must terminate silently and successfully.
          $second = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          if (-not $second.WaitForExit(3000)) {
            $second.Kill()
            throw "Second BlurMask instance did not exit promptly"
          }
          if ($second.ExitCode -ne 0) {
            throw "Second BlurMask instance exited with code $($second.ExitCode)"
          }

          if (-not $first.WaitForExit(45000)) {
            $first.Kill()
            throw "BlurMask smoke test timed out"
          }
          if ($first.ExitCode -ne 0) {
            $errorLog = Join-Path ([IO.Path]::GetTempPath()) 'BlurMask-smoke-error.txt'
            if (Test-Path -LiteralPath $errorLog) { Get-Content -LiteralPath $errorLog }
            throw "BlurMask exited with code $($first.ExitCode)"
          }
      - name: Upload actual UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlurMask-UI-previews
          path: |
            .artifacts/ui-preview/*.png
            .artifacts/ui-preview/*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-win-x64
          path: src/BlurMask/bin/Release/net11.0/win-x64/publish/
      - name: Software rendering / simulated RDP session
        shell: pwsh
        env:
          BLURMASK_TEST_REMOTE_SESSION: '1'
        run: |
          $exe = Resolve-Path "src\BlurMask\bin\Release\net11.0\win-x64\publish\BlurMask.exe"
          $test = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(45000)) { $test.Kill(); throw 'Software rendering smoke test timed out.' }
          if ($test.ExitCode -ne 0) { throw "Software rendering failed ($($test.ExitCode))." }

      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-Giac-Sources-win-x64
          path: |
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BlurMask-Giac-Build-Logs-win-x64
          path: |
            .artifacts/giac-build/**/build-*/*.log
            .artifacts/giac-build/**/build-*/**/*.log
            .artifacts/giac-runtime/**/manifest.json
            ${{ runner.temp }}/BlurMask-Giac-source-build/build-*/**/*.log
          if-no-files-found: ignore

  native-aot-linux:
    name: Native AOT / Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .artifacts/giac-runtime/linux-x64
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*-linux-x64.tar.gz
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*-linux-x64.tar.gz.sha256
          key: giac-linux-x64-${{ hashFiles('tools/prepare-giac-runtime.sh', 'tools/giac-native/**') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install Native AOT and X11 smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang build-essential m4 curl xz-utils zlib1g-dev xvfb libx11-6 libxcb-shape0 libice6 libsm6 libfontconfig1
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - run: bash ./tools/build.sh linux-x64
      - name: Native bundled Giac discovery and advanced mathematics
        shell: bash
        run: |
          publish="src/BlurMask/bin/Release/net11.0/linux-x64/publish"
          export BLURMASK_TEST_GIAC="$PWD/$publish/runtimes/linux-x64/solver/icas"
          "$publish/BlurMask" --math-solver-test
          dotnet run --project tools/InkMath.Solver.Probe -c Release -- "$BLURMASK_TEST_GIAC"
      - name: Native offline AI pen probe
        run: ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --ai-pen-test
      - name: Native overlay IPC probe
        run: ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --overlay-platform-test
      - name: Startup smoke test
        run: xvfb-run -a ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --smoke-test --minimized
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: src/BlurMask/bin/Release/net11.0/linux-x64/publish/

      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-Giac-Sources-linux-x64
          path: |
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BlurMask-Giac-Build-Logs-linux-x64
          path: |
            .artifacts/giac-build/**/build-*/*.log
            .artifacts/giac-build/**/build-*/**/*.log
            .artifacts/giac-runtime/**/manifest.json
            ${{ runner.temp }}/BlurMask-Giac-source-build/build-*/**/*.log
          if-no-files-found: ignore

  native-cloud:
    name: Native AOT / live collaboration / PostgreSQL
    needs: native-aot-linux
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pen_live_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pen_live_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Database=pen_live_test;Username=postgres;Password=postgres
      PublicUrl: http://127.0.0.1:5079
      BLURMASK_TEST_SERVER: http://127.0.0.1:5079
      BLURMASK_SMOKE_ARTIFACTS: ${{ github.workspace }}/.artifacts/collaboration-visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: .artifacts/native-cloud
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxcb-shape0 libice6 libsm6 libfontconfig1
      - name: Exercise native clients against the real API and live channel
        shell: bash
        run: |
          cd src/BlurMask.Server
          dotnet build -c Release
          dotnet run --no-build -c Release --urls http://127.0.0.1:5079 > /tmp/pen-live.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5079/healthz
          cd ../..
          chmod +x .artifacts/native-cloud/BlurMask
          xvfb-run -a .artifacts/native-cloud/BlurMask --isolated-smoke-test --software-rendering

      - name: Upload native collaboration visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlurMask-collaboration-visual
          path: |
            .artifacts/collaboration-visual/**/*.png
            .artifacts/collaboration-visual/**/*.csv
            .artifacts/collaboration-visual/smoke-error.txt

  native-wayland:
    name: Native AOT / native Wayland canvas
    needs: native-aot-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: .artifacts/native-wayland-payload
      - run: sudo apt-get update && sudo apt-get install -y weston libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libegl1 libgles2 libgl1-mesa-dri python3-pil
      - name: Verify native protocol, rendered canvas and compositor pixels
        run: |
          chmod +x .artifacts/native-wayland-payload/BlurMask
          bash tools/test-linux-wayland.sh .artifacts/native-wayland-payload/BlurMask "$GITHUB_WORKSPACE/.artifacts/native-wayland"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-native-wayland
