name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  render:
    name: Screenshot reduction / thin stroke coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: dotnet run --project tools/BlurMask.RenderProbe -c Release -- --output .artifacts/render-ci --label ci --frames 30
      - run: python tools/BlurMask.RenderProbe/quality.py .artifacts/render-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-Synthetic-Render
          path: .artifacts/render-ci/
  installer:
    name: Windows installer / Inno Setup 7.1.0
    needs: native-aot-windows
    uses: ./.github/workflows/installer.yml
    with:
      publish-artifact: BlurMask-win-x64
  deb:
    name: Debian installer / Linux x64
    needs: native-aot-linux
    uses: ./.github/workflows/deb.yml
    with:
      publish-artifact: BlurMask-linux-x64
  arch:
    name: Arch installer / Linux x64
    needs: native-aot-linux
    uses: ./.github/workflows/arch.yml
    with:
      publish-artifact: BlurMask-linux-x64
  void:
    name: Void installer / Linux x64 glibc
    needs: native-aot-linux
    uses: ./.github/workflows/xbps.yml
    with:
      publish-artifact: BlurMask-linux-x64
  server:
    name: Download page / API / PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BlurMask.Server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pen_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Database=pen_test;Username=postgres;Password=postgres
      PublicUrl: http://127.0.0.1:5079
      Live__MaxConnections: 64
      Live__MaxPerAddress: 16
      Live__MaxPerBoard: 16
      Live__MaxPreviewPoints: 40000
      PEN_TEST_PREVIEW_CAP: 40000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build -c Release
      - run: node --test tests/invite.test.mjs tests/landing.test.mjs
      - name: API integration test
        shell: bash
        run: |
          dotnet run --no-build -c Release --urls http://127.0.0.1:5079 > /tmp/pen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5079/healthz
          node --test tests/api.test.mjs
          node --test tests/receipt.test.mjs
          node --test tests/live.test.mjs
          node --test tests/security.test.mjs
          PEN_TEST_URL=http://127.0.0.1:5079 PEN_LOAD_BOARDS=4 PEN_LOAD_USERS=4 PEN_LOAD_WRITERS=2 PEN_LOAD_SECONDS=6 PEN_LOAD_IDLE_SECONDS=1 node tests/load.mjs
  build:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent neural reference dependencies
        run: python -m pip install numpy
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - run: dotnet build src/BlurMask/BlurMask.csproj -c Release --no-restore -p:PublishAot=false -p:SelfContained=false
      - name: Portable stroke engine numerical goldens, model validation and ink history
        run: dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --ai-pen-test
      - name: Math token formatter and model guards
        run: dotnet run --project tools/InkRecognition.Math.Probe -c Release
      - name: Symbolic mathematics grammar and command isolation
        run: dotnet run --project tools/InkMath.Solver.Probe -c Release
      - name: Raw-content geometry, mixed segmentation and model guards
        run: dotnet run --project tools/InkRecognition.RawContent.Probe -c Release
      - name: Legacy integer network and Russian feature numerical controls
        run: dotnet run --project tools/LegacyInk.Probe -c Release
      - name: Russian packed lexicon and bounded candidate decoding
        run: dotnet run --project tools/LegacyLexicon.Probe -c Release
      - name: Russian segmented word mapping and ambiguity guards
        run: dotnet run --project tools/LegacySegmentedWord.Probe -c Release
      - name: Separated physical ink grouping and geometry limits
        run: dotnet run --project tools/LegacySeparatedInk.Probe -c Release
      - name: Legacy directional landmarks and independent sample controls
        run: |
          python tools/LegacyDirectional.Probe/reference_controls.py .artifacts/legacy-directional-controls.json
          dotnet run --project tools/LegacyDirectional.Probe -c Release -- .artifacts/legacy-directional-controls.json
      - name: Legacy global shape statistics and independent arithmetic controls
        run: |
          python tools/LegacyDirectionalStatistics.Probe/reference_controls.py .artifacts/legacy-statistics-controls.json
          dotnet run --project tools/LegacyDirectionalStatistics.Probe -c Release -- .artifacts/legacy-statistics-controls.json
      - name: Bounded legacy resource parser controls
        run: python tools/test-legacy-ink.py
      - name: Legacy physical arc length window membership
        run: |
          python tools/LegacyArcLengthWindows.Probe/reference_controls.py .artifacts/legacy-window-controls.json
          dotnet run --project tools/LegacyArcLengthWindows.Probe -c Release -- .artifacts/legacy-window-controls.json
      - name: Legacy coordinate preparation and physical resampling
        run: |
          python tools/LegacyDirectionalCoordinates.Probe/reference_controls.py .artifacts/legacy-coordinate-controls.json
          dotnet run --project tools/LegacyDirectionalCoordinates.Probe -c Release -- .artifacts/legacy-coordinate-controls.json
      - name: Overlay compositor IPC ownership, cancellation and transport
        run: dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --overlay-platform-test
      - name: Legacy fixed point crossings and directional intersection classes
        run: |
          python tools/LegacyIntersection.Probe/reference_controls.py .artifacts/legacy-intersection-controls.json
          dotnet run --project tools/LegacyIntersection.Probe -c Release -- .artifacts/legacy-intersection-controls.json
      - name: Legacy temporal window statistics and calibrated channel assembly
        run: |
          python tools/LegacyDirectionalWindow.Probe/reference_controls.py .artifacts/legacy-temporal-controls.json
          dotnet run --project tools/LegacyDirectionalWindow.Probe -c Release -- .artifacts/legacy-temporal-controls.json
      - name: Legacy explicit baseline mapping and independent arithmetic controls
        run: |
          python tools/LegacyDirectionalBaseline.Probe/reference_controls.py .artifacts/legacy-baseline-controls.json
          dotnet run --project tools/LegacyDirectionalBaseline.Probe -c Release -- .artifacts/legacy-baseline-controls.json
      - name: Legacy composed temporal features and vendor-free model guards
        run: dotnet run --project tools/LegacyDirectionalModel.Probe -c Release
      - name: Legacy asymmetric prior context weighting
        run: |
          python tools/LegacyContextWeighting.Probe/reference_controls.py .artifacts/legacy-context-weight-controls.json
          dotnet run --project tools/LegacyContextWeighting.Probe -c Release -- .artifacts/legacy-context-weight-controls.json
      - name: Legacy float input multiplication and quantization
        run: |
          python tools/LegacyFloatInput.Probe/reference_controls.py .artifacts/legacy-float-input-controls.json
          dotnet run --project tools/LegacyFloatInput.Probe -c Release -- .artifacts/legacy-float-input-controls.json
      - name: Legacy prior context raster and geometry channels
        run: |
          python tools/LegacyContextGeometry.Probe/reference_controls.py .artifacts/legacy-context-geometry-controls.json
          dotnet run --project tools/LegacyContextGeometry.Probe -c Release -- .artifacts/legacy-context-geometry-controls.json
      - name: Legacy physical context overlap and line selection
        run: |
          python tools/LegacyPriorContext.Probe/reference_controls.py .artifacts/legacy-prior-context-controls.json
          dotnet run --project tools/LegacyPriorContext.Probe -c Release -- .artifacts/legacy-prior-context-controls.json
      - name: Legacy initial context window enumeration and complete prior chain
        run: dotnet run --project tools/LegacyContextWindow.Probe -c Release
      - name: Legacy spatial sample membership and independent interval controls
        run: |
          python tools/LegacySpatialWindows.Probe/reference_controls.py .artifacts/legacy-spatial-window-controls.json
          dotnet run --project tools/LegacySpatialWindows.Probe -c Release -- .artifacts/legacy-spatial-window-controls.json
      - name: Legacy spatial local statistics and calibrated channel controls
        run: |
          python tools/LegacySpatialStatistics.Probe/reference_controls.py .artifacts/legacy-spatial-statistics-controls.json
          dotnet run --project tools/LegacySpatialStatistics.Probe -c Release -- .artifacts/legacy-spatial-statistics-controls.json
      - name: Legacy complete spatial features and vendor-free model guards
        run: dotnet run --project tools/LegacySpatialModel.Probe -c Release
      - name: Legacy per-class calibration and active acoustic family aggregation
        run: |
          python tools/LegacyAcousticEnsemble.Probe/reference_controls.py .artifacts/legacy-ensemble-controls.json
          dotnet run --project tools/LegacyAcousticEnsemble.Probe -c Release -- .artifacts/legacy-ensemble-controls.json
      - name: Legacy complete word scoring and acoustic to dictionary roundtrip
        run: dotnet run --project tools/LegacyDirectionalWord.Probe -c Release
      - name: Verify committed recognition resource fingerprints
        run: python tools/verify-model-resources.py
      - name: Load portable Russian model data and verify restored line geometry
        run: |
          dotnet run --project tools/LegacyRussianBundle.Probe -c Release -- models/ru-RU/ru_RU-ak-cur.lite.res models/ru-RU/ru_RU-lk-text.lite.res models/ru-RU/legacy-engine-profile.json
          python tools/LegacyLineGeometry.Probe/reference_controls.py .artifacts/legacy-line-geometry-controls.json
          dotnet run --project tools/LegacyLineGeometry.Probe -c Release -- .artifacts/legacy-line-geometry-controls.json
          python tools/LegacyLineSamples.Probe/reference_controls.py .artifacts/legacy-line-samples-controls.json
          dotnet run --project tools/LegacyLineSamples.Probe -c Release -- .artifacts/legacy-line-samples-controls.json
          python tools/LegacyInkRanges.Probe/reference_controls.py .artifacts/legacy-ink-range-controls.json
          dotnet run --project tools/LegacyInkRanges.Probe -c Release -- .artifacts/legacy-ink-range-controls.json
          python tools/LegacyWordAuxiliary.Probe/reference_controls.py .artifacts/legacy-word-auxiliary-controls.json
          dotnet run --project tools/LegacyWordAuxiliary.Probe -c Release -- --controls .artifacts/legacy-word-auxiliary-controls.json
          dotnet run --project tools/LegacyWordAuxiliary.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res
          python tools/LegacyWordScorer.Probe/reference_controls.py .artifacts/legacy-word-scorer-controls.json
          dotnet run --project tools/LegacyWordScorer.Probe -c Release -- --controls .artifacts/legacy-word-scorer-controls.json
          dotnet run --project tools/LegacyWordScorer.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res
          python tools/LegacyCutBoundary.Probe/reference_controls.py .artifacts/legacy-cut-boundary-controls.json
          dotnet run --project tools/LegacyCutBoundary.Probe -c Release -- .artifacts/legacy-cut-boundary-controls.json
          python tools/LegacyCursiveAtoms.Probe/reference_controls.py .artifacts/legacy-cursive-atoms-controls.json
          dotnet run --project tools/LegacyCursiveAtoms.Probe -c Release -- .artifacts/legacy-cursive-atoms-controls.json
          python tools/PreparedLineClassifier.Probe/reference_controls.py .artifacts/line-classifier-controls.json models/line-geometry/line-2e3-30.res models/line-geometry/line-2e3-50.res
          dotnet run --project tools/PreparedLineClassifier.Probe -c Release -- .artifacts/line-classifier-controls.json
          python tools/LegacyLinePairFeatures.Probe/reference_controls.py .artifacts/line-pair-controls.json models/line-geometry/line-2e3-30.res models/line-geometry/line-2e3-50.res
          dotnet run --project tools/LegacyLinePairFeatures.Probe -c Release -- .artifacts/line-pair-controls.json models/line-geometry/line-2e3-30.res models/line-geometry/line-2e3-50.res
          python tools/LegacyCursiveGeometry.Probe/reference_controls.py .artifacts/cursive-geometry-controls.json
          dotnet run --project tools/LegacyCursiveGeometry.Probe -c Release -- .artifacts/cursive-geometry-controls.json
          python tools/LegacyCursivePreparedInk.Probe/reference_controls.py .artifacts/cursive-prepared-controls.json
          dotnet run --project tools/LegacyCursivePreparedInk.Probe -c Release -- .artifacts/cursive-prepared-controls.json
          python tools/LegacyCursiveCategory.Probe/reference_controls.py .artifacts/cursive-category-controls.json
          dotnet run --project tools/LegacyCursiveCategory.Probe -c Release -- .artifacts/cursive-category-controls.json models/ru-RU/ru_RU-ak-cur.lite.res
          python tools/LegacyWordCandidate.Probe/reference_controls.py .artifacts/word-candidate-controls.json
          dotnet run --project tools/LegacyWordCandidate.Probe -c Release -- --controls .artifacts/word-candidate-controls.json
          python tools/LegacyLineGroupSearch.Probe/reference_controls.py .artifacts/line-group-search-controls.json
          dotnet run --project tools/LegacyLineGroupSearch.Probe -c Release -- .artifacts/line-group-search-controls.json
          python tools/LegacyIntegerWord.Probe/reference_controls.py .artifacts/integer-word-controls.json
          dotnet run --project tools/LegacyIntegerWord.Probe -c Release -- --controls .artifacts/integer-word-controls.json
          dotnet run --project tools/LegacyIntegerWord.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res
          python tools/LegacyCursiveHorizontal.Probe/reference_controls.py .artifacts/cursive-horizontal-controls.json
          dotnet run --project tools/LegacyCursiveHorizontal.Probe -c Release -- .artifacts/cursive-horizontal-controls.json models/ru-RU/ru_RU-ak-cur.lite.res
      - name: Legacy stored word and class language costs
        run: |
          python tools/LegacyWordLanguage.Probe/reference_controls.py models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-language-controls.json
          dotnet run --project tools/LegacyWordLanguage.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-language-controls.json
      - name: Legacy dictionary terminal identity and language cost correspondence
        run: |
          python tools/LegacyWordIndex.Probe/reference_controls.py models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-word-index-controls.json
          dotnet run --project tools/LegacyWordIndex.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-word-index-controls.json
      - name: Legacy scalar word cost profiles and exact acoustic log costs
        run: |
          python tools/LegacyWordProfile.Probe/reference_controls.py .artifacts/legacy-word-profile-controls.json
          dotnet run --project tools/LegacyWordProfile.Probe -c Release -- --controls .artifacts/legacy-word-profile-controls.json
          dotnet run --project tools/LegacyWordProfile.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res
          python tools/LegacyFixedLog.Probe/reference_controls.py .artifacts/legacy-fixed-log-controls.json
          dotnet run --project tools/LegacyFixedLog.Probe -c Release -- .artifacts/legacy-fixed-log-controls.json
          python tools/LegacyCostEnsemble.Probe/reference_controls.py .artifacts/legacy-cost-ensemble-controls.json
          dotnet run --project tools/LegacyCostEnsemble.Probe -c Release -- .artifacts/legacy-cost-ensemble-controls.json
      - name: Verify independent recognition release packages
        if: runner.os == 'Linux'
        run: |
          for project in InkRecognition InkRecognition.Math InkRecognition.RawContent; do
            dotnet pack "src/$project/$project.csproj" -c Release -p:Version=0.0.0-ci -o .artifacts/recognition-packages
          done
          python tools/package-model-resources.py .artifacts/recognition-packages/InkRecognition-models.zip
          python tools/test-recognition-packages.py .artifacts/recognition-packages 0.0.0-ci
      - name: Install standalone recognition Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish and run standalone Russian word pipeline as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyDirectionalWord.Probe/LegacyDirectionalWord.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-word-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-word-native/LegacyDirectionalWord.Probe.exe' } else { './.artifacts/legacy-word-native/LegacyDirectionalWord.Probe' }
          & $probe
          exit $LASTEXITCODE
      - name: Publish and run portable Russian models and line geometry as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyRussianBundle.Probe/LegacyRussianBundle.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-russian-bundle-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-russian-bundle-native/LegacyRussianBundle.Probe.exe' } else { './.artifacts/legacy-russian-bundle-native/LegacyRussianBundle.Probe' }
          & $probe models/ru-RU/ru_RU-ak-cur.lite.res models/ru-RU/ru_RU-lk-text.lite.res models/ru-RU/legacy-engine-profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyLineGeometry.Probe/LegacyLineGeometry.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-line-geometry-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-line-geometry-native/LegacyLineGeometry.Probe.exe' } else { './.artifacts/legacy-line-geometry-native/LegacyLineGeometry.Probe' }
          & $probe .artifacts/legacy-line-geometry-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyLineSamples.Probe/LegacyLineSamples.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-line-samples-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-line-samples-native/LegacyLineSamples.Probe.exe' } else { './.artifacts/legacy-line-samples-native/LegacyLineSamples.Probe' }
          & $probe .artifacts/legacy-line-samples-controls.json
          exit $LASTEXITCODE
      - name: Publish and verify stored Russian language tables as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyWordLanguage.Probe/LegacyWordLanguage.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-language-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-language-native/LegacyWordLanguage.Probe.exe' } else { './.artifacts/legacy-language-native/LegacyWordLanguage.Probe' }
          & $probe models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-language-controls.json
          exit $LASTEXITCODE
      - name: Verify interior ink ranges and auxiliary language costs as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyInkRanges.Probe/LegacyInkRanges.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-ink-ranges-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-ink-ranges-native/LegacyInkRanges.Probe.exe' } else { './.artifacts/legacy-ink-ranges-native/LegacyInkRanges.Probe' }
          & $probe .artifacts/legacy-ink-range-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyWordAuxiliary.Probe/LegacyWordAuxiliary.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-word-auxiliary-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-word-auxiliary-native/LegacyWordAuxiliary.Probe.exe' } else { './.artifacts/legacy-word-auxiliary-native/LegacyWordAuxiliary.Probe' }
          & $probe --controls .artifacts/legacy-word-auxiliary-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe models/ru-RU/ru_RU-lk-text.lite.res
          exit $LASTEXITCODE
      - name: Publish and verify Russian dictionary word identities as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyWordIndex.Probe/LegacyWordIndex.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-word-index-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-word-index-native/LegacyWordIndex.Probe.exe' } else { './.artifacts/legacy-word-index-native/LegacyWordIndex.Probe' }
          & $probe models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-word-index-controls.json
          exit $LASTEXITCODE
      - name: Verify complete lexical subtotal and cut decisions as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyWordScorer.Probe/LegacyWordScorer.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-word-scorer-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-word-scorer-native/LegacyWordScorer.Probe.exe' } else { './.artifacts/legacy-word-scorer-native/LegacyWordScorer.Probe' }
          & $probe --controls .artifacts/legacy-word-scorer-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe models/ru-RU/ru_RU-lk-text.lite.res
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyCutBoundary.Probe/LegacyCutBoundary.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-cut-boundary-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-cut-boundary-native/LegacyCutBoundary.Probe.exe' } else { './.artifacts/legacy-cut-boundary-native/LegacyCutBoundary.Probe' }
          & $probe .artifacts/legacy-cut-boundary-controls.json
          exit $LASTEXITCODE
      - name: Publish and verify Russian cost arithmetic as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyWordProfile.Probe/LegacyWordProfile.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-word-profile-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-word-profile-native/LegacyWordProfile.Probe.exe' } else { './.artifacts/legacy-word-profile-native/LegacyWordProfile.Probe' }
          & $probe --controls .artifacts/legacy-word-profile-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe models/ru-RU/ru_RU-lk-text.lite.res
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyFixedLog.Probe/LegacyFixedLog.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-fixed-log-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-fixed-log-native/LegacyFixedLog.Probe.exe' } else { './.artifacts/legacy-fixed-log-native/LegacyFixedLog.Probe' }
          & $probe .artifacts/legacy-fixed-log-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/LegacyCostEnsemble.Probe/LegacyCostEnsemble.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-cost-ensemble-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-cost-ensemble-native/LegacyCostEnsemble.Probe.exe' } else { './.artifacts/legacy-cost-ensemble-native/LegacyCostEnsemble.Probe' }
          & $probe .artifacts/legacy-cost-ensemble-controls.json
          exit $LASTEXITCODE
      - name: Verify continuous stroke atoms and embedded line classifiers as Native AOT
        shell: pwsh
        run: |
          dotnet publish tools/LegacyCursiveAtoms.Probe/LegacyCursiveAtoms.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/legacy-cursive-atoms-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/legacy-cursive-atoms-native/LegacyCursiveAtoms.Probe.exe' } else { './.artifacts/legacy-cursive-atoms-native/LegacyCursiveAtoms.Probe' }
          & $probe .artifacts/legacy-cursive-atoms-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/PreparedLineClassifier.Probe/PreparedLineClassifier.Probe.csproj -c Release -p:PublishAot=true -o .artifacts/line-classifier-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = if ($IsWindows) { './.artifacts/line-classifier-native/PreparedLineClassifier.Probe.exe' } else { './.artifacts/line-classifier-native/PreparedLineClassifier.Probe' }
          & $probe .artifacts/line-classifier-controls.json
          exit $LASTEXITCODE

      - name: Verify raw line features, cursive geometry and word totals as Native AOT
        shell: pwsh
        run: |
          $cases = @(
            @{ Name = 'LegacyLinePairFeatures'; Args = @('.artifacts/line-pair-controls.json', 'models/line-geometry/line-2e3-30.res', 'models/line-geometry/line-2e3-50.res') },
            @{ Name = 'LegacyCursiveGeometry'; Args = @('.artifacts/cursive-geometry-controls.json') },
            @{ Name = 'LegacyCursivePreparedInk'; Args = @('.artifacts/cursive-prepared-controls.json') },
            @{ Name = 'LegacyCursiveCategory'; Args = @('.artifacts/cursive-category-controls.json', 'models/ru-RU/ru_RU-ak-cur.lite.res') },
            @{ Name = 'LegacyWordCandidate'; Args = @('--controls', '.artifacts/word-candidate-controls.json') }
            @{ Name = 'LegacyLineGroupSearch'; Args = @('.artifacts/line-group-search-controls.json') },
            @{ Name = 'LegacyIntegerWord'; Args = @('--controls', '.artifacts/integer-word-controls.json') },
            @{ Name = 'LegacyCursiveHorizontal'; Args = @('.artifacts/cursive-horizontal-controls.json', 'models/ru-RU/ru_RU-ak-cur.lite.res') }
          )
          foreach ($case in $cases) {
            $name = $case.Name
            dotnet publish "tools/$name.Probe/$name.Probe.csproj" -c Release -p:PublishAot=true -o ".artifacts/$name-native"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $suffix = if ($IsWindows) { '.exe' } else { '' }
            $probe = "./.artifacts/$name-native/$name.Probe$suffix"
            $probeArgs = $case.Args
            & $probe @probeArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "./.artifacts/LegacyIntegerWord-native/LegacyIntegerWord.Probe$suffix" models/ru-RU/ru_RU-lk-text.lite.res
          exit $LASTEXITCODE

  symbolic-math:
    name: Native local CAS / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install Linux CAS CLI and Native AOT build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xcas clang zlib1g-dev
      - name: Extract verified official Windows CLI without running its installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = ./tools/fetch-giac-test-runtime.ps1
          "BLURMASK_TEST_GIAC=$exe" >> $env:GITHUB_ENV
      - name: Locate Linux CLI
        if: runner.os == 'Linux'
        run: echo "BLURMASK_TEST_GIAC=$(command -v icas)" >> "$GITHUB_ENV"
      - name: Actual calculus, equations, matrices and process cancellation under Native AOT
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          dotnet publish tools/InkMath.Solver.Probe -c Release -r $rid -p:PublishAot=true -o .artifacts/solver-probe
          if ($LASTEXITCODE -ne 0) { throw 'CAS probe publish failed.' }
          $exe = if ($IsWindows) { '.artifacts/solver-probe/InkMath.Solver.Probe.exe' } else { '.artifacts/solver-probe/InkMath.Solver.Probe' }
          & $exe $env:BLURMASK_TEST_GIAC
          if ($LASTEXITCODE -ne 0) { throw 'Actual native CAS numerical/resource checks failed.' }
          dotnet build src/BlurMask -c Release -p:PublishAot=false -p:SelfContained=false
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --ai-pen-test
          if ($LASTEXITCODE -ne 0) { throw 'CAS application typesetting/equals policy integration failed.' }

  native-aot-windows:
    name: Native AOT / Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - name: Publish
        shell: pwsh
        run: .\tools\build.ps1 win-x64 -Version "1.0.0-dev.$env:GITHUB_RUN_NUMBER"
      - name: Verify static graphics and bundled formula runtime
        shell: pwsh
        run: |
          $dir = "src\BlurMask\bin\Release\net11.0\win-x64\publish"
          if (-not (Test-Path (Join-Path $dir 'BlurMask.exe'))) { throw 'Native executable is missing.' }
          if (Get-ChildItem $dir -Filter '*.dll') { throw 'Static native build contains external DLLs.' }
          if (Get-ChildItem $dir -Filter '*.pdb') { throw 'Native payload contains debug symbols.' }
          $math = Join-Path $dir 'runtimes/win-x64/native'
          foreach ($name in @('onnxruntime.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'LICENSE')) {
            if (-not (Test-Path (Join-Path $math $name))) { throw "Formula dependency is missing: $name" }
          }
      - name: Native hot-path performance probe
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --performance-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Native performance probe failed.' }
      - name: Native mask region equivalence and performance
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --mask-performance-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Mask region probe failed.' }
      - name: Native offline AI pen probe
        shell: pwsh
        run: |
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --ai-pen-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'AI pen probe failed.' }
          & ./src/BlurMask/bin/Release/net11.0/win-x64/publish/BlurMask.exe --overlay-platform-test | Out-Default
          if ($LASTEXITCODE -ne 0) { throw 'Overlay IPC probe failed.' }
      - name: Startup and single-instance smoke test
        shell: pwsh
        env:
          BLURMASK_SMOKE_ARTIFACTS: ${{ github.workspace }}/.artifacts/ui-preview
        run: |
          $exe = Resolve-Path "src\BlurMask\bin\Release\net11.0\win-x64\publish\BlurMask.exe"

          # First process owns the single-instance mutex and remains alive long enough
          # for a duplicate launch to be tested.
          $first = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--minimized' -WindowStyle Hidden -PassThru
          Start-Sleep -Milliseconds 500

          if ($first.HasExited) {
            throw "First BlurMask instance exited before duplicate-launch test (code $($first.ExitCode))"
          }

          # A duplicate launch must terminate silently and successfully.
          $second = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          if (-not $second.WaitForExit(3000)) {
            $second.Kill()
            throw "Second BlurMask instance did not exit promptly"
          }
          if ($second.ExitCode -ne 0) {
            throw "Second BlurMask instance exited with code $($second.ExitCode)"
          }

          if (-not $first.WaitForExit(45000)) {
            $first.Kill()
            throw "BlurMask smoke test timed out"
          }
          if ($first.ExitCode -ne 0) {
            $errorLog = Join-Path ([IO.Path]::GetTempPath()) 'BlurMask-smoke-error.txt'
            if (Test-Path -LiteralPath $errorLog) { Get-Content -LiteralPath $errorLog }
            throw "BlurMask exited with code $($first.ExitCode)"
          }
      - name: Upload actual UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlurMask-UI-previews
          path: |
            .artifacts/ui-preview/*.png
            .artifacts/ui-preview/*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-win-x64
          path: src/BlurMask/bin/Release/net11.0/win-x64/publish/
      - name: Software rendering / simulated RDP session
        shell: pwsh
        env:
          BLURMASK_TEST_REMOTE_SESSION: '1'
        run: |
          $exe = Resolve-Path "src\BlurMask\bin\Release\net11.0\win-x64\publish\BlurMask.exe"
          $test = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(45000)) { $test.Kill(); throw 'Software rendering smoke test timed out.' }
          if ($test.ExitCode -ne 0) { throw "Software rendering failed ($($test.ExitCode))." }

  native-aot-linux:
    name: Native AOT / Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install Native AOT and X11 smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb libx11-6 libxcb-shape0 libice6 libsm6 libfontconfig1
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - run: bash ./tools/build.sh linux-x64
      - name: Native offline AI pen probe
        run: ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --ai-pen-test
      - name: Native overlay IPC probe
        run: ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --overlay-platform-test
      - name: Startup smoke test
        run: xvfb-run -a ./src/BlurMask/bin/Release/net11.0/linux-x64/publish/BlurMask --smoke-test --minimized
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: src/BlurMask/bin/Release/net11.0/linux-x64/publish/

  native-cloud:
    name: Native AOT / live collaboration / PostgreSQL
    needs: native-aot-linux
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pen_live_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pen_live_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Database=pen_live_test;Username=postgres;Password=postgres
      PublicUrl: http://127.0.0.1:5079
      BLURMASK_TEST_SERVER: http://127.0.0.1:5079
      BLURMASK_SMOKE_ARTIFACTS: ${{ github.workspace }}/.artifacts/collaboration-visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: .artifacts/native-cloud
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxcb-shape0 libice6 libsm6 libfontconfig1
      - name: Exercise native clients against the real API and live channel
        shell: bash
        run: |
          cd src/BlurMask.Server
          dotnet build -c Release
          dotnet run --no-build -c Release --urls http://127.0.0.1:5079 > /tmp/pen-live.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5079/healthz
          cd ../..
          chmod +x .artifacts/native-cloud/BlurMask
          xvfb-run -a .artifacts/native-cloud/BlurMask --isolated-smoke-test --software-rendering

      - name: Upload native collaboration visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlurMask-collaboration-visual
          path: |
            .artifacts/collaboration-visual/**/*.png
            .artifacts/collaboration-visual/**/*.csv
            .artifacts/collaboration-visual/smoke-error.txt

  native-wayland:
    name: Native AOT / native Wayland canvas
    needs: native-aot-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: .artifacts/native-wayland-payload
      - run: sudo apt-get update && sudo apt-get install -y weston libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libegl1 libgles2 libgl1-mesa-dri python3-pil
      - name: Verify native protocol, rendered canvas and compositor pixels
        run: |
          chmod +x .artifacts/native-wayland-payload/BlurMask
          bash tools/test-linux-wayland.sh .artifacts/native-wayland-payload/BlurMask "$GITHUB_WORKSPACE/.artifacts/native-wayland"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-native-wayland
          path: .artifacts/native-wayland/

  native-linux-cpu:
    name: Native AOT / Linux CPU / ${{ matrix.renderer }}
    needs: native-aot-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        renderer: [default, software]
    env:
      BLURMASK_MEMORY_CPU_ONLY: '1'
      BLURMASK_MEMORY_SCREEN: 1600x1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-linux-x64
          path: .artifacts/linux-cpu-payload
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth openbox picom xdotool wmctrl x11-utils mesa-utils python3
      - name: Measure idle and active own-process CPU
        env:
          RENDERER: ${{ matrix.renderer }}
        run: |
          chmod +x .artifacts/linux-cpu-payload/BlurMask
          args=()
          if [[ "$RENDERER" == software ]]; then args+=(--software-rendering); fi
          bash tools/test-linux-memory.sh .artifacts/linux-cpu-payload/BlurMask "$GITHUB_WORKSPACE/.artifacts/linux-cpu-$RENDERER" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-Linux-CPU-${{ matrix.renderer }}
          path: .artifacts/linux-cpu-${{ matrix.renderer }}/

  native-aot-macos:
    name: Native AOT / macOS host architecture
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - name: Publish for runner architecture
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then RID=osx-arm64; else RID=osx-x64; fi
          echo "RID=$RID" >> "$GITHUB_ENV"
          bash ./tools/build.sh "$RID"
      - name: Native offline AI pen probe
        run: ./src/BlurMask/bin/Release/net11.0/${{ env.RID }}/publish/BlurMask --ai-pen-test
      - name: Native overlay IPC probe
        run: ./src/BlurMask/bin/Release/net11.0/${{ env.RID }}/publish/BlurMask --overlay-platform-test
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-macos
          path: src/BlurMask/bin/Release/net11.0/${{ env.RID }}/publish/

  math-native-runtime:
    name: Formula runtime ABI / ${{ matrix.os }}
    needs: [native-aot-windows, native-aot-linux, native-aot-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BlurMask-win-x64
          - os: ubuntu-22.04
            artifact: BlurMask-linux-x64
          - os: macos-latest
            artifact: BlurMask-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .artifacts/formula-app
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Verify published CPU runtime through an independent Native AOT process
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          dotnet publish tools/InkRecognition.Math.Probe/InkRecognition.Math.Probe.csproj -c Release -r $rid -p:PublishAot=true -o .artifacts/math-probe
          if ($LASTEXITCODE -ne 0) { throw 'Math probe publish failed.' }
          $exe = if ($IsWindows) { '.artifacts/math-probe/InkRecognition.Math.Probe.exe' } else { '.artifacts/math-probe/InkRecognition.Math.Probe' }
          $lib = if ($IsWindows) { 'onnxruntime.dll' } elseif ($IsMacOS) { 'libonnxruntime.dylib' } else { 'libonnxruntime.so' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Math formatter/model guards failed.' }
          & $exe --runtime-native ".artifacts/formula-app/runtimes/$rid/native/$lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native formula ABI/inference/cancellation failed.' }
          dotnet publish tools/InkRecognition.RawContent.Probe/InkRecognition.RawContent.Probe.csproj -c Release -r $rid -p:PublishAot=true -o .artifacts/raw-content-probe
          if ($LASTEXITCODE -ne 0) { throw 'Raw-content probe publish failed.' }
          $raw = if ($IsWindows) { '.artifacts/raw-content-probe/InkRecognition.RawContent.Probe.exe' } else { '.artifacts/raw-content-probe/InkRecognition.RawContent.Probe' }
          & $raw
          if ($LASTEXITCODE -ne 0) { throw 'Raw-content feature/segmentation checks failed.' }
          & $raw --runtime-native ".artifacts/formula-app/runtimes/$rid/native/$lib"
          if ($LASTEXITCODE -ne 0) { throw 'Raw-content native CPU ABI checks failed.' }
