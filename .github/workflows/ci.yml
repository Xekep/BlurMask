name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  #Finish long main-branch Native AOT checks; newer pushes wait without cancelling them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  render:
    name: Screenshot reduction / thin stroke coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: dotnet run --project tools/BlurMask.RenderProbe -c Release -- --output .artifacts/render-ci --label ci --frames 30
      - run: python tools/BlurMask.RenderProbe/quality.py .artifacts/render-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-Synthetic-Render
          path: .artifacts/render-ci/
  installer:
    name: Windows installer / Inno Setup 7.1.0
    needs: native-aot-windows
    uses: ./.github/workflows/installer.yml
    with:
      publish-artifact: BlurMask-win-x64
  deb:
    name: Debian installer / Linux x64
    needs: native-aot-linux
    uses: ./.github/workflows/deb.yml
    with:
      publish-artifact: BlurMask-linux-x64
  arch:
    name: Arch installer / Linux x64
    needs: native-aot-linux
    uses: ./.github/workflows/arch.yml
    with:
      publish-artifact: BlurMask-linux-x64
  void:
    name: Void installer / Linux x64 glibc
    needs: native-aot-linux
    uses: ./.github/workflows/xbps.yml
    with:
      publish-artifact: BlurMask-linux-x64
  server:
    name: Download page / API / PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BlurMask.Server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pen_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Database=pen_test;Username=postgres;Password=postgres
      PublicUrl: http://127.0.0.1:5079
      Live__MaxConnections: 64
      Live__MaxPerAddress: 16
      Live__MaxPerBoard: 16
      Live__MaxPreviewPoints: 40000
      PEN_TEST_PREVIEW_CAP: 40000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build -c Release
      - run: node --test tests/invite.test.mjs tests/landing.test.mjs
      - name: API integration test
        shell: bash
        run: |
          dotnet run --no-build -c Release --urls http://127.0.0.1:5079 > /tmp/pen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5079/healthz
          node --test tests/api.test.mjs
          node --test tests/receipt.test.mjs
          node --test tests/live.test.mjs
          node --test tests/security.test.mjs
          PEN_TEST_URL=http://127.0.0.1:5079 PEN_LOAD_BOARDS=4 PEN_LOAD_USERS=4 PEN_LOAD_WRITERS=2 PEN_LOAD_SECONDS=6 PEN_LOAD_IDLE_SECONDS=1 node tests/load.mjs
  build:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent neural reference dependencies
        run: python -m pip install numpy PyYAML==6.0.2
      - name: Validate Bash workflow syntax before long recognition tests
        shell: bash
        run: python tools/check-workflow-shells.py --bash-script tools/ci/check-recognition-managed.sh .github/workflows/ci.yml
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - run: dotnet build src/BlurMask/BlurMask.csproj -c Release --no-restore -p:PublishAot=false -p:SelfContained=false
      - name: Compile gated recognition drafts and check cancellation contract
        shell: bash
        run: |
          dotnet build tools/LegacyEnglishCaseNode0Completion.Probe -c Release
          dotnet build tools/LegacyFst28CNumberTrueLanguage.Probe -c Release
          python -I -B tools/LegacyEnglishCaseNode0Completion.Probe/check_guard_payload.py --self-test
          mkdir -p .artifacts
          dotnet run --no-build --project tools/LegacyEnglishCaseNode0Completion.Probe -c Release -- --index-only models .artifacts/node0-model-index-managed.json
      - name: English ordinary node1 prefix and consumed-field mask controls
        shell: bash
        run: |
          dotnet build tools/LegacyEnglishCaseNode1.Probe -c Release
          dotnet build tools/LegacyEnglishCaseNode1.ActualEntry -c Release
          dotnet run --no-build --project tools/LegacyEnglishCaseNode1.Probe -c Release -- --prepared models .artifacts/node1-prefix-prepared.json
          python -I -B tools/LegacyEnglishCaseNode1.Probe/audit_prepared.py .artifacts/node1-prefix-prepared.json
      - name: English graph ring, language anchors and FIRST writer controls
        shell: bash
        run: |
          mkdir -p .artifacts
          dotnet build tools/LegacyEnglishGraphCursor.Probe -c Release
          dotnet build tools/LegacyEnglishGraph.ActualEntry -c Release
          dotnet build tools/LegacyEnglishGraphLoop.ActualEntry -c Release
          dotnet run --no-build --project tools/LegacyEnglishGraphCursor.Probe -c Release > .artifacts/english-graph-prepared.log
          python -I -B tools/LegacyEnglishGraphCursor.Probe/audit_prepared.py .artifacts/english-graph-prepared.log --tamper
      - name: English tagged history and known-word numerical records
        shell: bash
        run: |
          dotnet run --project tools/LegacyEnglishTaggedWord.Probe -c Release -- models .artifacts/english-tagged-word.json
          python -I -B tools/LegacyEnglishTaggedWord.Probe/audit_reference.py models .artifacts/english-tagged-word.json .artifacts/english-tagged-word-reference
      - name: Portable stroke engine numerical goldens, model validation and ink history
        run: dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --ai-pen-test
      - name: Math token formatter and model guards
        run: dotnet run --project tools/InkRecognition.Math.Probe -c Release
      - name: Symbolic mathematics grammar and command isolation
        run: dotnet run --project tools/InkMath.Solver.Probe -c Release
      - name: Legacy mathematical symbol-sequence layout and numerical policy
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathSymbolSequence.Probe -c Release -- models/math/math-ak.res .artifacts/math-symbol-sequence-prepared.json --prepared
          python -I -B tools/LegacyMathSymbolSequence.Probe/audit_prepared.py models/math/math-ak.res .artifacts/math-symbol-sequence-prepared.json .artifacts/math-symbol-sequence-prepared-audit.json
          python -I -B tools/LegacyMathSymbolSequence.Probe/audit_raw_sequence.py . .artifacts/math-symbol-sequence-raw-audit.json
          dotnet run --project tools/LegacyMathSymbolSequence.Probe -c Release -- models/math/math-ak.res .artifacts/math-symbol-sequence-cost.json --score-controls
          python -I -B tools/LegacyMathSymbolSequence.Probe/audit_rescore.py models/math/math-ak.res .artifacts/math-symbol-sequence-cost.json .artifacts/math-symbol-sequence-cost-audit.json
      - name: Primary compact word flags and independent full-record controls
        shell: bash
        run: |
          python -I -B tools/LegacyMainPrimaryCompactFlags.Probe/generate_controls.py .artifacts/primary-flags-input.json
          dotnet run --project tools/LegacyMainPrimaryCompactFlags.Probe -c Release -- .artifacts/primary-flags-input.json .artifacts/primary-flags-output.json
          python -I -B tools/LegacyMainPrimaryCompactFlags.Probe/audit_output.py .artifacts/primary-flags-input.json .artifacts/primary-flags-output.json
      - name: English final compact publication and terminal prepared controls
        shell: bash
        run: |
          python -I -B tools/LegacyEnglishGraphCompact.Probe/generate_controls.py . .artifacts/en-finalcompact-input.json
          dotnet run --project tools/LegacyEnglishGraphCompact.Probe -c Release -- models/en-US/en_US-ak-cur.lite.res .artifacts/en-finalcompact-input.json .artifacts/en-finalcompact-output.json
          python -I -B tools/LegacyEnglishGraphCompact.Probe/audit_output.py models/en-US/en_US-ak-cur.lite.res .artifacts/en-finalcompact-input.json .artifacts/en-finalcompact-output.json --tamper
          dotnet build tools/LegacyEnglishGraphCompact.ActualEntry -c Release
      - name: Original Math AK source geometry and independent rounding controls
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkGeometry.Probe -c Release -- . .artifacts/math-ak-geometry.json
          python -I -B tools/LegacyMathAkGeometry.Probe/audit_output.py .artifacts/math-ak-geometry.json .artifacts/math-ak-geometry-audit.json
      - name: Original Math single-stroke temporal inputs and independent reference
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkTemporal.Probe -c Release -- . .artifacts/math-ak-temporal.json
          python -I -B tools/LegacyMathAkTemporal.Probe/audit_output.py . .artifacts/math-ak-temporal.json .artifacts/math-ak-temporal-audit.json
      - name: Original Math single-stroke spatial inputs and independent reference
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkSpatial.Probe -c Release -- . .artifacts/math-ak-spatial.json
          python -I -B tools/LegacyMathAkSpatial.Probe/audit_output.py . .artifacts/math-ak-spatial.json .artifacts/math-ak-spatial-audit.json
      - name: Original Math fixed1F synthetic numerical and conversion controls
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkTemporalNumeric.Probe -c Release -- .artifacts/math-1f-prepared.json
          python -I -B tools/LegacyMathAkTemporalNumeric.Probe/audit_output.py . .artifacts/math-1f-prepared.json .artifacts/math-1f-prepared-audit.json
      - name: Selected mathematical model ownership without inference
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkSelectedModels.Probe -c Release -- . .artifacts/math-selected-models.json
          python -I -B tools/LegacyMathAkSelectedModels.Probe/audit_output.py . .artifacts/math-selected-models.json
      - name: Original Math selected2F synthetic numerical and ownership controls
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathAkSpatialNumeric.Probe -c Release -- . .artifacts/math-2f-prepared.json
          python -I -B tools/LegacyMathAkSpatialNumeric.Probe/audit_output.py .artifacts/math-2f-prepared.json .artifacts/math-2f-prepared-audit.json
      - name: Original Math grammar, parsed reconstruction and AK terminal binding
        shell: bash
        run: |
          dotnet run --project tools/LegacyMathGrammar.Probe -c Release -- . .artifacts/math-grammar.json
          python -I -B tools/LegacyMathGrammar.Probe/audit_output.py . .artifacts/math-grammar.json .artifacts/math-grammar-audit.json
      - name: Raw-content geometry, mixed segmentation and model guards
        run: dotnet run --project tools/InkRecognition.RawContent.Probe -c Release
      - name: Legacy integer network and Russian feature numerical controls
        run: dotnet run --project tools/LegacyInk.Probe -c Release
      - name: Exact Russian collapsed subgroup features and independent neural oracle
        shell: bash
        run: |
          mkdir -p .artifacts
          dotnet run --project tools/LegacyRussianFirstDegenerate.Probe -c Release -- models tools/LegacyRussianFirstDegenerate.Probe/normalized-controls.json .artifacts/legacy-russian-first-degenerate-managed.json
          python -I -B tools/LegacyRussianFirstDegenerate.Probe/audit_output.py models tools/LegacyRussianFirstDegenerate.Probe/normalized-controls.json .artifacts/legacy-russian-first-degenerate-managed.json
      - name: Russian global source-completion concurrency harness (compile only)
        run: dotnet build tools/LegacyGlobalNoCandidateConcurrency.Probe -c Release
      - name: Global augmentation topology and preclaim guards without inference
        run: dotnet run --project tools/LegacyGlobalWordAugmentation.OwnerDiagnostic -c Release -- --prepared .artifacts/global-augmentation-envelope.json
      - name: Global augmentation historical numeric replay harness (compile only)
        run: dotnet build tools/LegacyGlobalWordAugmentation.Probe -c Release
      - name: Russian packed lexicon and bounded candidate decoding
        run: dotnet run --project tools/LegacyLexicon.Probe -c Release
      - name: Russian segmented word mapping and ambiguity guards
        run: dotnet run --project tools/LegacySegmentedWord.Probe -c Release
      - name: Separated physical ink grouping and geometry limits
        run: dotnet run --project tools/LegacySeparatedInk.Probe -c Release
      - name: Legacy directional landmarks and independent sample controls
        run: |
          python tools/LegacyDirectional.Probe/reference_controls.py .artifacts/legacy-directional-controls.json
          dotnet run --project tools/LegacyDirectional.Probe -c Release -- .artifacts/legacy-directional-controls.json
      - name: Legacy global shape statistics and independent arithmetic controls
        run: |
          python tools/LegacyDirectionalStatistics.Probe/reference_controls.py .artifacts/legacy-statistics-controls.json
          dotnet run --project tools/LegacyDirectionalStatistics.Probe -c Release -- .artifacts/legacy-statistics-controls.json
      - name: Bounded legacy resource parser controls
        run: python tools/test-legacy-ink.py
      - name: Legacy physical arc length window membership
        run: |
          python tools/LegacyArcLengthWindows.Probe/reference_controls.py .artifacts/legacy-window-controls.json
          dotnet run --project tools/LegacyArcLengthWindows.Probe -c Release -- .artifacts/legacy-window-controls.json
      - name: Legacy coordinate preparation and physical resampling
        run: |
          python tools/LegacyDirectionalCoordinates.Probe/reference_controls.py .artifacts/legacy-coordinate-controls.json
          dotnet run --project tools/LegacyDirectionalCoordinates.Probe -c Release -- .artifacts/legacy-coordinate-controls.json
      - name: Overlay compositor IPC ownership, cancellation and transport
        run: dotnet src/BlurMask/bin/Release/net11.0/BlurMask.dll --overlay-platform-test
      - name: Legacy fixed point crossings and directional intersection classes
        run: |
          python tools/LegacyIntersection.Probe/reference_controls.py .artifacts/legacy-intersection-controls.json
          dotnet run --project tools/LegacyIntersection.Probe -c Release -- .artifacts/legacy-intersection-controls.json
      - name: Legacy temporal window statistics and calibrated channel assembly
        run: |
          python tools/LegacyDirectionalWindow.Probe/reference_controls.py .artifacts/legacy-temporal-controls.json
          dotnet run --project tools/LegacyDirectionalWindow.Probe -c Release -- .artifacts/legacy-temporal-controls.json
      - name: Legacy explicit baseline mapping and independent arithmetic controls
        run: |
          python tools/LegacyDirectionalBaseline.Probe/reference_controls.py .artifacts/legacy-baseline-controls.json
          dotnet run --project tools/LegacyDirectionalBaseline.Probe -c Release -- .artifacts/legacy-baseline-controls.json
      - name: Legacy composed temporal features and vendor-free model guards
        run: dotnet run --project tools/LegacyDirectionalModel.Probe -c Release
      - name: Legacy asymmetric prior context weighting
        run: |
          python tools/LegacyContextWeighting.Probe/reference_controls.py .artifacts/legacy-context-weight-controls.json
          dotnet run --project tools/LegacyContextWeighting.Probe -c Release -- .artifacts/legacy-context-weight-controls.json
      - name: Legacy float input multiplication and quantization
        run: |
          python tools/LegacyFloatInput.Probe/reference_controls.py .artifacts/legacy-float-input-controls.json
          dotnet run --project tools/LegacyFloatInput.Probe -c Release -- .artifacts/legacy-float-input-controls.json
      - name: Legacy prior context raster and geometry channels
        run: |
          python tools/LegacyContextGeometry.Probe/reference_controls.py .artifacts/legacy-context-geometry-controls.json
          dotnet run --project tools/LegacyContextGeometry.Probe -c Release -- .artifacts/legacy-context-geometry-controls.json
      - name: Legacy physical context overlap and line selection
        run: |
          python tools/LegacyPriorContext.Probe/reference_controls.py .artifacts/legacy-prior-context-controls.json
          dotnet run --project tools/LegacyPriorContext.Probe -c Release -- .artifacts/legacy-prior-context-controls.json
      - name: Legacy initial context window enumeration and complete prior chain
        run: dotnet run --project tools/LegacyContextWindow.Probe -c Release
      - name: Legacy spatial sample membership and independent interval controls
        run: |
          python tools/LegacySpatialWindows.Probe/reference_controls.py .artifacts/legacy-spatial-window-controls.json
          dotnet run --project tools/LegacySpatialWindows.Probe -c Release -- .artifacts/legacy-spatial-window-controls.json
      - name: Legacy spatial local statistics and calibrated channel controls
        run: |
          python tools/LegacySpatialStatistics.Probe/reference_controls.py .artifacts/legacy-spatial-statistics-controls.json
          dotnet run --project tools/LegacySpatialStatistics.Probe -c Release -- .artifacts/legacy-spatial-statistics-controls.json
      - name: Legacy complete spatial features and vendor-free model guards
        run: dotnet run --project tools/LegacySpatialModel.Probe -c Release
      - name: Legacy per-class calibration and active acoustic family aggregation
        run: |
          python tools/LegacyAcousticEnsemble.Probe/reference_controls.py .artifacts/legacy-ensemble-controls.json
          dotnet run --project tools/LegacyAcousticEnsemble.Probe -c Release -- .artifacts/legacy-ensemble-controls.json
      - name: Legacy complete word scoring and acoustic to dictionary roundtrip
        run: dotnet run --project tools/LegacyDirectionalWord.Probe -c Release
      - name: Verify committed recognition resource fingerprints
        run: python tools/verify-model-resources.py
      - name: Load portable Russian model data and verify restored line geometry
        shell: bash
        run: bash -e -o pipefail tools/ci/check-recognition-managed.sh
      - name: Legacy stored word and class language costs
        run: |
          python tools/LegacyWordLanguage.Probe/reference_controls.py models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-language-controls.json
          dotnet run --project tools/LegacyWordLanguage.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-language-controls.json
      - name: Legacy dictionary terminal identity and language cost correspondence
        run: |
          python tools/LegacyWordIndex.Probe/reference_controls.py models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-word-index-controls.json
          dotnet run --project tools/LegacyWordIndex.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res .artifacts/legacy-word-index-controls.json
      - name: Legacy scalar word cost profiles and exact acoustic log costs
        run: |
          python tools/LegacyWordProfile.Probe/reference_controls.py .artifacts/legacy-word-profile-controls.json
          dotnet run --project tools/LegacyWordProfile.Probe -c Release -- --controls .artifacts/legacy-word-profile-controls.json
          dotnet run --project tools/LegacyWordProfile.Probe -c Release -- models/ru-RU/ru_RU-lk-text.lite.res
          python tools/LegacyFixedLog.Probe/reference_controls.py .artifacts/legacy-fixed-log-controls.json
          dotnet run --project tools/LegacyFixedLog.Probe -c Release -- .artifacts/legacy-fixed-log-controls.json
          python tools/LegacyCostEnsemble.Probe/reference_controls.py .artifacts/legacy-cost-ensemble-controls.json
          dotnet run --project tools/LegacyCostEnsemble.Probe -c Release -- .artifacts/legacy-cost-ensemble-controls.json
      - name: Verify independent recognition release packages
        if: runner.os == 'Linux'
        run: |
          for project in InkRecognition InkRecognition.Math InkRecognition.RawContent; do
            dotnet pack "src/$project/$project.csproj" -c Release -p:Version=0.0.0-ci -o .artifacts/recognition-packages
          done
          python tools/package-model-resources.py .artifacts/recognition-packages/InkRecognition-models.zip
          python tools/test-recognition-packages.py .artifacts/recognition-packages 0.0.0-ci
      - name: Install standalone recognition Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Linguistic primitives and English acoustic components Native AOT parity
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          foreach ($project in @('LegacyFst23C.Probe', 'LegacyFst13AOutgoing.Probe', 'LegacyFst28CPrimaryMap.Probe', 'LegacyFst28CTargetPreparation.Probe', 'LegacyFst28CInitialState.Probe', 'LegacyFst28CFreshPrimaryControllerBootstrap.Probe', 'LegacyFst28CNumberSymbolMasks.Probe', 'LegacyFst28CNumberInitialD0.Probe', 'LegacyFst28CNumberInitialQueryBinding.Probe', 'LegacyFst28CNumberInitialPage.Probe', 'LegacyFst28CNumberInitialConsumerContext.Probe', 'LegacyFst28CNumberInitialConsumer.Probe', 'LegacyFst28CNumberSkippedLanguageCompletion.Probe', 'LegacyFullEnglishFirst.Probe', 'LegacyFullEnglishFirstConfidence.Probe', 'LegacyFullEnglishFirstController.Probe', 'LegacyFullEnglishFirstPrimary.Probe', 'LegacyFullEnglishFirstContext.Probe', 'LegacyFullEnglishFirstTerminal.Probe', 'LegacyFullEnglishFirstPlainText.Probe', 'LegacyFullEnglishFirstGlyphEmission.Probe', 'LegacyFullEnglishFirstSourceRecords.Probe', 'LegacyEnglishCaseMain.Probe', 'LegacyEnglishCaseInitialization.Probe', 'LegacyEnglishCaseInitialQuery.Probe', 'LegacyEnglishCaseInitialConsumer.Probe', 'LegacyEnglishCasePrimaryCompletion.Probe')) {
            $capture = switch ($project) {
              'LegacyFst23C.Probe' { 'legacy-fst23c' }
              'LegacyFst13AOutgoing.Probe' { 'legacy-fst13a-outgoing' }
              'LegacyFst28CPrimaryMap.Probe' { 'legacy-fst28c-primary-map' }
              'LegacyFst28CTargetPreparation.Probe' { 'legacy-fst28c-target-preparation' }
              'LegacyFst28CInitialState.Probe' { 'legacy-fst28c-initial' }
              'LegacyFst28CFreshPrimaryControllerBootstrap.Probe' { 'legacy-fst28c-bootstrap' }
              'LegacyFst28CNumberSymbolMasks.Probe' { 'legacy-fst28c-number-symbol-masks' }
              'LegacyFst28CNumberInitialD0.Probe' { 'legacy-fst28c-number-initial-d0' }
              'LegacyFst28CNumberInitialQueryBinding.Probe' { 'legacy-fst28c-number-initial-binding' }
              'LegacyFst28CNumberInitialPage.Probe' { 'legacy-fst28c-number-initial-page' }
              'LegacyFst28CNumberInitialConsumerContext.Probe' { 'legacy-fst28c-number-initial-consumer-context' }
              'LegacyFst28CNumberInitialConsumer.Probe' { 'legacy-fst28c-number-initial-consumer' }
              'LegacyFst28CNumberSkippedLanguageCompletion.Probe' { 'legacy-fst28c-number-node0-completion' }
              'LegacyFullEnglishFirstConfidence.Probe' { 'legacy-en-full-first-confidence' }
              'LegacyFullEnglishFirstController.Probe' { 'legacy-en-full-first-controller' }
              'LegacyFullEnglishFirstPrimary.Probe' { 'legacy-en-full-first-primary' }
              'LegacyFullEnglishFirstContext.Probe' { 'legacy-en-full-first-context' }
              'LegacyFullEnglishFirstTerminal.Probe' { 'legacy-en-full-first-terminal' }
              'LegacyFullEnglishFirstPlainText.Probe' { 'legacy-en-full-first-plain' }
              'LegacyFullEnglishFirstGlyphEmission.Probe' { 'legacy-en-full-first-glyph' }
              'LegacyFullEnglishFirstSourceRecords.Probe' { 'legacy-en-full-first-source' }
              'LegacyEnglishCaseMain.Probe' { 'legacy-en-case-main' }
              'LegacyEnglishCaseInitialization.Probe' { 'legacy-en-case-initialization' }
              'LegacyEnglishCaseInitialQuery.Probe' { 'legacy-en-case-initial-query' }
              'LegacyEnglishCaseInitialConsumer.Probe' { 'legacy-en-case-initial-consumer' }
              'LegacyEnglishCasePrimaryCompletion.Probe' { 'legacy-en-case-primary-completion' }
              default { 'legacy-en-full-first' }
            }
            $directory = "./.artifacts/$capture-native"
            dotnet publish "tools/$project/$project.csproj" -c Release -p:PublishAot=true -o $directory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $arguments = @('models')
            if ($project -in @('LegacyFullEnglishFirst.Probe', 'LegacyFullEnglishFirstConfidence.Probe', 'LegacyFullEnglishFirstController.Probe', 'LegacyFullEnglishFirstPrimary.Probe', 'LegacyFullEnglishFirstContext.Probe', 'LegacyFullEnglishFirstTerminal.Probe', 'LegacyFullEnglishFirstPlainText.Probe', 'LegacyFullEnglishFirstGlyphEmission.Probe', 'LegacyFullEnglishFirstSourceRecords.Probe', 'LegacyEnglishCaseMain.Probe', 'LegacyEnglishCaseInitialization.Probe', 'LegacyEnglishCaseInitialQuery.Probe', 'LegacyEnglishCaseInitialConsumer.Probe', 'LegacyEnglishCasePrimaryCompletion.Probe')) { $arguments += '.artifacts/legacy-en119-final-single-blind.json' }
            $arguments += ".artifacts/$capture-native.json"
            if ($project -eq 'LegacyEnglishCasePrimaryCompletion.Probe') { $arguments = @('--owner') + $arguments }
