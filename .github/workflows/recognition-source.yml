name: Recognition source geometry

on:
  push:
    branches: [main]
    paths:
      - 'src/InkRecognition/**'
      - 'tools/LegacyContext226RoundedExtent.Probe/**'
      - 'tools/LegacyOrdinaryChronologyFactor.Probe/**'
      - 'tools/NativeSelectedTextAdmission.Probe/**'
      - 'tools/WholeWordMatchingBound.Probe/**'
      - 'models/math/**'
      - 'models/ru-RU/**'
      - 'tools/LegacyMixedClassProbabilities.Probe/**'
      - 'tools/LegacyMainConfidenceCalibration.Probe/**'
      - 'tools/LegacyInk.Probe/**'
      - 'tools/LegacyAcousticEnsemble.Probe/**'
      - 'tools/handwriting/ru_main_mixed_probability.py'
      - 'tools/ci/check-mixed-class-probabilities.py'
      - 'global.json'
      - 'tools/LegacyMathAk*/**'
      - 'tools/LegacyOrientationSmoothing.Probe/**'
      - 'tools/LegacyCursive*/**'
      - 'tools/ci/check-math-source-geometry.py'
      - 'tools/ci/check-math-fresh-workspace.py'
      - 'tools/ci/check-math-first276-program.py'
      - 'tools/ci/check-math-first276-al.py'
      - 'tools/ci/check-math-first276-model-storage.py'
      - 'tools/ci/check-math-first276-input14.py'
      - 'tools/ci/check-math-first276-numerical14.py'
      - 'tools/ci/check-math-first276-normalization14.py'
      - 'tools/ci/check-structured-word-delivery.py'
      - 'tools/ci/check-english-input-bootstrap.py'
      - 'tools/LegacyEnglishEarlySelected*/**'
      - 'tools/LegacyEnglishSelectedSources*/**'
      - 'tools/LegacyEnglishSourceIndices*/**'
      - 'tools/LegacyEnglishOriginalInput*/**'
      - 'tools/LegacyEnglishGraphLoop.ActualEntry/**'
      - 'tools/LegacyEnglishGraphParentPredecessor.ActualEntry/**'
      - 'tools/ci/check-english-graph-parent.py'
      - 'tools/LegacyCompletedPostTextWork.Probe/**'
      - 'tools/LegacyCompletedStructuredWords.Audit/**'
      - 'tools/LegacyConfiguredTwoAltAugmentation.Probe/**'
      - 'tools/ci/check-configured-two-alt-raw.py'
      - '.github/workflows/recognition-source.yml'
  pull_request:
    paths:
      - 'src/InkRecognition/**'
      - 'tools/LegacyContext226RoundedExtent.Probe/**'
      - 'tools/LegacyOrdinaryChronologyFactor.Probe/**'
      - 'tools/NativeSelectedTextAdmission.Probe/**'
      - 'tools/WholeWordMatchingBound.Probe/**'
      - 'models/math/**'
      - 'models/ru-RU/**'
      - 'tools/LegacyMixedClassProbabilities.Probe/**'
      - 'tools/LegacyMainConfidenceCalibration.Probe/**'
      - 'tools/LegacyInk.Probe/**'
      - 'tools/LegacyAcousticEnsemble.Probe/**'
      - 'tools/handwriting/ru_main_mixed_probability.py'
      - 'tools/ci/check-mixed-class-probabilities.py'
      - 'global.json'
      - 'tools/LegacyMathAk*/**'
      - 'tools/LegacyOrientationSmoothing.Probe/**'
      - 'tools/LegacyCursive*/**'
      - 'tools/ci/check-math-source-geometry.py'
      - 'tools/ci/check-math-fresh-workspace.py'
      - 'tools/ci/check-math-first276-program.py'
      - 'tools/ci/check-math-first276-al.py'
      - 'tools/ci/check-math-first276-model-storage.py'
      - 'tools/ci/check-math-first276-input14.py'
      - 'tools/ci/check-math-first276-numerical14.py'
      - 'tools/ci/check-math-first276-normalization14.py'
      - 'tools/ci/check-structured-word-delivery.py'
      - 'tools/ci/check-english-input-bootstrap.py'
      - 'tools/LegacyEnglishEarlySelected*/**'
      - 'tools/LegacyEnglishSelectedSources*/**'
      - 'tools/LegacyEnglishSourceIndices*/**'
      - 'tools/LegacyEnglishOriginalInput*/**'
      - 'tools/LegacyEnglishGraphLoop.ActualEntry/**'
      - 'tools/LegacyEnglishGraphParentPredecessor.ActualEntry/**'
      - 'tools/ci/check-english-graph-parent.py'
      - 'tools/LegacyCompletedPostTextWork.Probe/**'
      - 'tools/LegacyCompletedStructuredWords.Audit/**'
      - 'tools/LegacyConfiguredTwoAltAugmentation.Probe/**'
      - 'tools/ci/check-configured-two-alt-raw.py'
      - '.github/workflows/recognition-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recognition-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-context:
    name: Ordinary chronology and context / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - run: dotnet run --project tools/LegacyContext226RoundedExtent.Probe -c Release -- tools/LegacyContext226RoundedExtent.Probe/fake-inputs.json after
      - run: dotnet run --project tools/LegacyOrdinaryChronologyFactor.Probe -c Release -- tools/LegacyOrdinaryChronologyFactor.Probe/fake-maps.json after
      - run: dotnet run --project tools/NativeSelectedTextAdmission.Probe -c Release -- tools/NativeSelectedTextAdmission.Probe/fake-admission.json after
      - run: dotnet run --project tools/WholeWordMatchingBound.Probe -c Release
  english-input:
    name: English input bootstrap / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/check-english-input-bootstrap.py .artifacts/english-input-bootstrap
      - run: python tools/ci/check-english-graph-parent.py .artifacts/english-graph-parent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-input-bootstrap-${{ matrix.os }}
          path: |
            .artifacts/english-input-bootstrap/*.json
            .artifacts/english-input-bootstrap/*.log
            .artifacts/english-graph-parent/*.json
            .artifacts/english-graph-parent/*.log
  structured:
    name: Structured WORD delivery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/check-structured-word-delivery.py .artifacts/structured-word-delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-word-delivery-${{ matrix.os }}
          path: |
            .artifacts/structured-word-delivery/*.json
            .artifacts/structured-word-delivery/*.log
  scalar:
    name: Scalar source / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python tools/ci/check-math-first276-program.py .artifacts/math-first276-program
      - run: python tools/ci/check-math-first276-al.py .artifacts/math-first276-al
      - run: python tools/ci/check-math-first276-model-storage.py .artifacts/math-first276-model-storage
      - run: python tools/ci/check-math-first276-input14.py .artifacts/math-first276-input14
      - run: python tools/ci/check-math-first276-numerical14.py .artifacts/math-first276-numerical14
      - run: python tools/ci/check-math-first276-normalization14.py .artifacts/math-first276-normalization14
      - run: python tools/ci/check-math-fresh-workspace.py .artifacts/math-fresh-workspace
      - run: python tools/ci/check-math-source-geometry.py .artifacts/math-source-geometry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-source-geometry-${{ matrix.os }}
          path: |
            .artifacts/math-source-geometry/*.json
            .artifacts/math-source-geometry/*.log
            .artifacts/math-fresh-workspace/*.json
            .artifacts/math-fresh-workspace/*.log
            .artifacts/math-first276-program/*.json
            .artifacts/math-first276-program/*.log
            .artifacts/math-first276-al/*.json
            .artifacts/math-first276-al/*.log
            .artifacts/math-first276-al/data-audit-controls/*.json
            .artifacts/math-first276-model-storage/*.json
            .artifacts/math-first276-model-storage/*.log
            .artifacts/math-first276-input14/*.json
            .artifacts/math-first276-input14/*.log
            .artifacts/math-first276-numerical14/*.json
            .artifacts/math-first276-numerical14/*.log
            .artifacts/math-first276-normalization14/*.json
            .artifacts/math-first276-normalization14/*.log

  configured-raw:
    name: Configured RAW stored DATA / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/check-configured-two-alt-raw.py .artifacts/configured-two-alt-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-two-alt-raw-${{ matrix.os }}
          path: |
            .artifacts/configured-two-alt-raw/*.json
            .artifacts/configured-two-alt-raw/*.log

  mixed-probabilities:
    name: Mixed probabilities and calibration / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -B tools/ci/check-mixed-class-probabilities.py .artifacts/mixed-class-probabilities
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-class-probabilities-${{ matrix.os }}
          path: |
            .artifacts/mixed-class-probabilities/*.json
            .artifacts/mixed-class-probabilities/*.log
