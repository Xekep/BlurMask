name: Recognition source geometry

on:
  push:
    branches: [main]
    paths:
      - 'src/InkRecognition/**'
      - 'models/math/**'
      - 'global.json'
      - 'tools/LegacyMathAk*/**'
      - 'tools/LegacyOrientationSmoothing.Probe/**'
      - 'tools/LegacyCursive*/**'
      - 'tools/ci/check-math-source-geometry.py'
      - 'tools/ci/check-math-fresh-workspace.py'
      - 'tools/ci/check-structured-word-delivery.py'
      - 'tools/ci/check-english-input-bootstrap.py'
      - 'tools/LegacyEnglishEarlySelected*/**'
      - 'tools/LegacyEnglishSelectedSources*/**'
      - 'tools/LegacyCompletedPostTextWork.Probe/**'
      - 'tools/LegacyCompletedStructuredWords.Audit/**'
      - '.github/workflows/recognition-source.yml'
  pull_request:
    paths:
      - 'src/InkRecognition/**'
      - 'models/math/**'
      - 'global.json'
      - 'tools/LegacyMathAk*/**'
      - 'tools/LegacyOrientationSmoothing.Probe/**'
      - 'tools/LegacyCursive*/**'
      - 'tools/ci/check-math-source-geometry.py'
      - 'tools/ci/check-math-fresh-workspace.py'
      - 'tools/ci/check-structured-word-delivery.py'
      - 'tools/ci/check-english-input-bootstrap.py'
      - 'tools/LegacyEnglishEarlySelected*/**'
      - 'tools/LegacyEnglishSelectedSources*/**'
      - 'tools/LegacyCompletedPostTextWork.Probe/**'
      - 'tools/LegacyCompletedStructuredWords.Audit/**'
      - '.github/workflows/recognition-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recognition-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  english-input:
    name: English input bootstrap / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/check-english-input-bootstrap.py .artifacts/english-input-bootstrap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-input-bootstrap-${{ matrix.os }}
          path: |
            .artifacts/english-input-bootstrap/*.json
            .artifacts/english-input-bootstrap/*.log
  structured:
    name: Structured WORD delivery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/check-structured-word-delivery.py .artifacts/structured-word-delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-word-delivery-${{ matrix.os }}
          path: |
            .artifacts/structured-word-delivery/*.json
            .artifacts/structured-word-delivery/*.log
  scalar:
    name: Scalar source / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python tools/ci/check-math-fresh-workspace.py .artifacts/math-fresh-workspace
      - run: python tools/ci/check-math-source-geometry.py .artifacts/math-source-geometry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-source-geometry-${{ matrix.os }}
          path: |
            .artifacts/math-source-geometry/*.json
            .artifacts/math-source-geometry/*.log
            .artifacts/math-fresh-workspace/*.json
            .artifacts/math-fresh-workspace/*.log
