name: Math DOM value port

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/math-dom-port.yml'
      - 'src/InkRecognition.Math/Math2Dom*.cs'
      - 'src/InkRecognition.Math/Math2Mode0FreshMathPublisher.cs'
      - 'src/InkRecognition.Math/Math2Mode0OriginalMathFieldSource.cs'
      - 'src/InkRecognition.Math/Math2Mode0RetainedInk.cs'
      - 'tools/Math2DomValue.Probe/**'
      - 'tools/handwriting/ports/dom-parser-20261028/reference_controls.py'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/math-dom-port.yml'
      - 'src/InkRecognition.Math/Math2Dom*.cs'
      - 'src/InkRecognition.Math/Math2Mode0FreshMathPublisher.cs'
      - 'src/InkRecognition.Math/Math2Mode0OriginalMathFieldSource.cs'
      - 'src/InkRecognition.Math/Math2Mode0RetainedInk.cs'
      - 'tools/Math2DomValue.Probe/**'
      - 'tools/handwriting/ports/dom-parser-20261028/reference_controls.py'
      - 'global.json'

permissions:
  contents: read

concurrency:
  group: math-dom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  values:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_PROCESSOR_COUNT: 2
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-preview.7.26381.103
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze independent controls before compilation
        shell: bash
        run: |
          mkdir -p .artifacts/math-dom
          python -B tools/handwriting/ports/dom-parser-20261028/reference_controls.py .artifacts/math-dom/strings.json
          python -B tools/Math2DomValue.Probe/reference_controls.py .artifacts/math-dom/numbers.json
          python -B tools/Math2DomValue.Probe/finite_controls.py .artifacts/math-dom/finite.json
          python -B tools/Math2DomValue.Probe/cb8_controls.py .artifacts/math-dom/cb8.json
      - name: Independent Netlib mode2 and mode6 comparison
        run: python -B tools/Math2DomValue.Probe/reference/run_reference.py .artifacts/math-dom/finite.json .artifacts/math-dom/reference
      - name: Managed DOM and default string service checks
        run: dotnet run --project tools/Math2DomValue.Probe -c Release -- .artifacts/math-dom/strings.json .artifacts/math-dom/numbers.json .artifacts/math-dom/finite.json .artifacts/math-dom/cb8.json
      - name: Native AOT checks on the same frozen inputs
        shell: pwsh
        run: |
          $rid = switch ("$env:RUNNER_OS/$env:RUNNER_ARCH") {
            'Windows/X64' { 'win-x64' }
            'Linux/X64' { 'linux-x64' }
            'macOS/ARM64' { 'osx-arm64' }
            'macOS/X64' { 'osx-x64' }
            default { throw 'Unsupported runner platform' }
          }
          dotnet publish tools/Math2DomValue.Probe -c Release -r $rid -p:PublishAot=true -m:1 --disable-build-servers -p:UseSharedCompilation=false -o .artifacts/math-dom/native
          if ($LASTEXITCODE -ne 0) { throw 'Native probe build failed' }
          $exe = if ($IsWindows) { '.artifacts/math-dom/native/Math2DomValue.Probe.exe' } else { './.artifacts/math-dom/native/Math2DomValue.Probe' }
          & $exe .artifacts/math-dom/strings.json .artifacts/math-dom/numbers.json .artifacts/math-dom/finite.json .artifacts/math-dom/cb8.json
          if ($LASTEXITCODE -ne 0) { throw 'Native DOM checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-dom-controls-${{ matrix.os }}
          path: |
            .artifacts/math-dom/*.json
            .artifacts/math-dom/reference/*.json
            .artifacts/math-dom/reference/*.log
          if-no-files-found: ignore
