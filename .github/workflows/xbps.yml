name: Void Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version; empty uses 1.0.0-dev.<run>'
        required: false
        type: string
      publish-artifact:
        description: 'Verified Linux Native AOT artifact from source-run-id'
        default: BlurMask-linux-x64
        required: false
        type: string
      source-run-id:
        description: 'Completed CI run that produced the verified Linux artifact; required unless release-tag is set'
        required: false
        type: string
      release-tag:
        description: 'Optional existing release: reuse its checksum-verified Linux archive'
        required: false
        type: string
  workflow_call:
    inputs:
      publish-artifact:
        required: true
        type: string
      version:
        required: false
        default: ''
        type: string
      source-run-id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  void:
    runs-on: ubuntu-22.04
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      GH_TOKEN: ${{ github.token }}
      PAYLOAD: .artifacts/void-payload
    steps:
      - uses: actions/checkout@v4
      - name: Require an existing verified Native AOT payload
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$SOURCE_RUN_ID" && -z "$RELEASE_TAG" ]]; then
            echo 'Provide source-run-id or release-tag; this installer never rebuilds the app.' >&2
            exit 2
          fi
          if [[ -n "$SOURCE_RUN_ID" ]]; then [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; fi
          if [[ -n "$RELEASE_TAG" && -n "$SOURCE_RUN_ID" ]]; then echo 'Choose artifact run or release archive.' >&2; exit 2; fi
      - uses: actions/download-artifact@v4
        if: inputs.release-tag == ''
        with:
          name: ${{ inputs.publish-artifact }}
          path: .artifacts/void-payload
          run-id: ${{ inputs.source-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download and verify an existing release archive
        if: inputs.release-tag != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ -z "$PACKAGE_VERSION" || "$PACKAGE_VERSION" == "${RELEASE_TAG#v}" ]]
          echo "PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          mkdir -p .artifacts/void-release "$PAYLOAD"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern BlurMask-linux-x64.tar.gz --dir .artifacts/void-release
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "BlurMask-linux-x64.tar.gz") | .digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "${digest#sha256:}  .artifacts/void-release/BlurMask-linux-x64.tar.gz" | sha256sum --check
          tar -xzf .artifacts/void-release/BlurMask-linux-x64.tar.gz -C "$PAYLOAD"
      - name: Package the existing payload in official Void glibc
        shell: bash
        run: |
          version="${PACKAGE_VERSION:-1.0.0-dev.$GITHUB_RUN_NUMBER}"
          version="${version#v}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p .artifacts/void-installers
          docker pull --platform linux/amd64 ghcr.io/void-linux/void-glibc-full:latest
          image="$(docker image inspect ghcr.io/void-linux/void-glibc-full:latest --format '{{.Id}}')"
          echo "VOID_IMAGE=$image" >> "$GITHUB_ENV"
          docker image inspect "$image" > .artifacts/void-installers/container-image.json
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/.artifacts/void-installers:/output" -w /workspace \
            -e BLURMASK_VERSION="$version" -e PAYLOAD -e SOURCE_DATE_EPOCH "$image" sh -euc '
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -y bash findutils shadow util-linux
              useradd --create-home builder
              chown builder /output
              runuser -u builder -- bash tools/build-xbps.sh "$BLURMASK_VERSION" "$PAYLOAD" /output
            '
      - name: Install, launch, reinstall and remove in a fresh Void glibc container
        shell: bash
        run: |
          mkdir -p .artifacts/void-ui/results
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/.artifacts/void-ui/results:/tmp/void-ui-results" \
            -w /workspace "$VOID_IMAGE" sh -euc '
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -y bash findutils shadow util-linux desktop-file-utils xvfb-run dejavu-fonts-ttf \
                openbox picom xdotool wmctrl ImageMagick python3-Pillow glxinfo mesa-dri \
                xwininfo xdpyinfo xsetroot
              command -v python magick
              python --version
              magick -version
              result=0
              bash tools/test-xbps.sh .artifacts/void-installers/*.x86_64.xbps || result=$?
              chmod -R a+rX /tmp/void-ui-results
              exit "$result"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlurMask-Void-UI
          path: .artifacts/void-ui/results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-Void-Installer
          path: |
            .artifacts/void-installers/*.x86_64.xbps
            .artifacts/void-installers/*.x86_64.xbps.sha256
          if-no-files-found: error
