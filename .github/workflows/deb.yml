name: Debian Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version; empty uses 1.0.0-dev.<run>'
        required: false
        type: string
  workflow_call:
    inputs:
      publish-artifact:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-22.04
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: inputs.publish-artifact == ''
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev dpkg-dev desktop-file-utils xvfb libx11-6 libice6 libsm6 libfontconfig1
      - uses: actions/download-artifact@v4
        if: inputs.publish-artifact != ''
        with:
          name: ${{ inputs.publish-artifact }}
          path: src/BlurMask/bin/Release/net11.0/linux-x64/publish
      - if: inputs.publish-artifact == ''
        run: bash ./tools/build.sh linux-x64
      - name: Package and test Debian installer
        run: |
          version="${PACKAGE_VERSION:-1.0.0-dev.$GITHUB_RUN_NUMBER}"
          bash ./tools/build-deb.sh linux-x64 "$version"
          bash ./tools/test-deb.sh .artifacts/installers/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-Debian-Installer
          path: .artifacts/installers/*
          if-no-files-found: error
