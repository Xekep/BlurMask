name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .artifacts/giac-runtime/win-x64
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz
            .artifacts/installers/BlurMask-Giac-corresponding-sources-*.tar.gz.sha256
          key: giac-win-x64-${{ hashFiles('tools/prepare-giac-runtime.ps1', 'tools/giac-native/**') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          .\tools\build.ps1 win-x64 -Version $version
          Compress-Archive -Path "src\BlurMask\bin\Release\net11.0\win-x64\publish\*" -DestinationPath BlurMask-win-x64.zip
          .\tools\build-installer.ps1 -Version $version -SkipPublish -PublishDirectory src/BlurMask/bin/Release/net11.0/win-x64/publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
          dotnet run --project tools/InkMath.Solver.Probe -c Release -- .artifacts/giac-runtime/win-x64/icas.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Giac verification failed.' }
          $installers = @(Get-ChildItem .artifacts/installers/*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $installer = $installers[0]
          .\tools\test-installer.ps1 -InstallerPath $installer.FullName -PublishDirectory src/BlurMask/bin/Release/net11.0/win-x64/publish
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            BlurMask-win-x64.zip
            .artifacts/installers/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev dpkg-dev desktop-file-utils xvfb libx11-6 libxcb-shape0 libice6 libsm6 libfontconfig1
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - run: |
          bash ./tools/build.sh linux-x64 "${RELEASE_VERSION#v}"
          tar -C src/BlurMask/bin/Release/net11.0/linux-x64/publish -czf BlurMask-linux-x64.tar.gz .
          bash ./tools/build-deb.sh linux-x64 "${RELEASE_VERSION#v}"
          bash ./tools/test-deb.sh .artifacts/installers/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            BlurMask-linux-x64.tar.gz
            .artifacts/installers/*
      - uses: actions/upload-artifact@v4
        with:
          name: BlurMask-linux-native
          path: src/BlurMask/bin/Release/net11.0/linux-x64/publish/

  arch:
    needs: linux
    uses: ./.github/workflows/arch.yml
    with:
      publish-artifact: BlurMask-linux-native
      version: ${{ github.ref_name }}

  void:
    needs: linux
    uses: ./.github/workflows/xbps.yml
    with:
      publish-artifact: BlurMask-linux-native
      version: ${{ github.ref_name }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore src/BlurMask/BlurMask.csproj
      - shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then RID=osx-arm64; else RID=osx-x64; fi
          bash ./tools/build.sh "$RID" "${GITHUB_REF_NAME#v}"
          tar -C "src/BlurMask/bin/Release/net11.0/$RID/publish" -czf "BlurMask-$RID.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: BlurMask-osx-*.tar.gz

  recognition-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package independent recognition libraries and separate model assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          for project in InkRecognition InkRecognition.Math InkRecognition.RawContent; do
            dotnet pack "src/$project/$project.csproj" -c Release -p:Version="$version" -o .artifacts/recognition-release
          done
          python tools/package-model-resources.py .artifacts/recognition-release/InkRecognition-models.zip
          python tools/test-recognition-packages.py .artifacts/recognition-release "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-recognition-library
          path: .artifacts/recognition-release/*
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    needs: [windows, linux, macos, arch, void, recognition-library]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'release-*'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-Arch-Installer
          path: dist/arch
      - uses: actions/download-artifact@v4
        with:
          name: BlurMask-Void-Installer
          path: dist/void
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          # Mixed upload paths preserve .artifacts/installers as a nested directory.
          # Gather every file, including hidden directories, before attaching assets.
          while IFS= read -r -d '' file; do
            target="release-assets/$(basename "$file")"
            if [[ -e "$target" ]]; then echo "Duplicate release asset: $target" >&2; exit 1; fi
            cp "$file" "$target"
          done < <(find dist -type f -print0)
          options=()
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [[ -f "$notes" ]]; then options+=(--notes-file "$notes"); else options+=(--generate-notes); fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
