name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore
      - shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          .\build.ps1 win-x64 -Version $version
          Compress-Archive -Path "bin\Release\net11.0\win-x64\publish\*" -DestinationPath BlurMask-win-x64.zip
          .\build-installer.ps1 -Version $version -SkipPublish -PublishDirectory bin/Release/net11.0/win-x64/publish
          $installers = @(Get-ChildItem .artifacts/installers/*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $installer = $installers[0]
          .\tools\test-installer.ps1 -InstallerPath $installer.FullName -PublishDirectory bin/Release/net11.0/win-x64/publish
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            BlurMask-win-x64.zip
            .artifacts/installers/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet restore
      - run: |
          bash ./build.sh linux-x64
          tar -C bin/Release/net11.0/linux-x64/publish -czf BlurMask-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: BlurMask-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - run: dotnet restore
      - shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then RID=osx-arm64; else RID=osx-x64; fi
          bash ./build.sh "$RID"
          tar -C "bin/Release/net11.0/$RID/publish" -czf "BlurMask-$RID.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: BlurMask-osx-*.tar.gz

  publish-release:
    permissions:
      contents: write
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
