name: Native mask region selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mask-regions.yml'
      - 'tools/NovaPen.MaskProbe/**'
      - 'src/NovaPen/NativeWindowCatalog.cs'
      - 'src/NovaPen/NativeMaskAttachment.cs'
      - 'src/NovaPen/NativeWindowHierarchy.cs'
      - 'src/NovaPen/WindowFillPicker.cs'
      - 'src/NovaPen/MaskWindowAttachment.cs'
      - 'src/NovaPen/MaskAttachmentCoverage.cs'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_PROCESSOR_COUNT: '2'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Check tracking and real offscreen Win32 children
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/mask-regions | Out-Null
          dotnet run --project tools/NovaPen.MaskProbe/NovaPen.MaskProbe.csproj -c Release --no-launch-profile 2>&1 | Tee-Object .artifacts/mask-regions/probe.txt
          if ($LASTEXITCODE -ne 0) { throw 'Mask region regression probe failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mask-regions
          path: .artifacts/mask-regions/
